name: mNote Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "m*-*"
    tags:
      - "v*"

concurrency:
  group: mnote-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (pinned submodule)
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          no-save-caches: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      # Signing: with the four secrets below the APK is signed with the mNote
      # release key. Without them (forks, PRs) Gradle falls back to
      # android/fallback-key.properties, i.e. a test-only signature.
      #   MNOTE_KEYSTORE_BASE64   base64 of mnote-release.jks
      #   MNOTE_STORE_PASSWORD    keystore password
      #   MNOTE_KEY_PASSWORD      key password
      #   MNOTE_KEY_ALIAS         key alias (mnote)
      - name: Setup release keystore
        env:
          MNOTE_KEYSTORE_BASE64: ${{ secrets.MNOTE_KEYSTORE_BASE64 }}
          MNOTE_STORE_PASSWORD: ${{ secrets.MNOTE_STORE_PASSWORD }}
          MNOTE_KEY_PASSWORD: ${{ secrets.MNOTE_KEY_PASSWORD }}
          MNOTE_KEY_ALIAS: ${{ secrets.MNOTE_KEY_ALIAS }}
        if: ${{ env.MNOTE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$MNOTE_KEYSTORE_BASE64" | base64 -d > android/mnote-release.jks
          {
            echo "storePassword=$MNOTE_STORE_PASSWORD"
            echo "keyPassword=$MNOTE_KEY_PASSWORD"
            echo "keyAlias=$MNOTE_KEY_ALIAS"
            echo "storeFile=../mnote-release.jks"
          } > android/key.properties

      - name: Analyze changed mNote code
        run: flutter analyze lib/components/nextcloud/nc_login_step.dart

      - name: Run mNote regression tests
        run: flutter test test/login_keyboard_overflow_test.dart

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=UPDATE_CHECK=false

      - name: Rename APK
        id: rename
        run: |
          buildName=$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)
          apkName="mNote_v${buildName}_${GITHUB_SHA::7}_arm64.apk"
          mkdir -p output
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "output/$apkName"
          echo "apkName=$apkName" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mNote-Android-arm64
          path: output/${{ steps.rename.outputs.apkName }}

      - name: Upload to GitHub release
        uses: svenstaro/upload-release-action@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: output/${{ steps.rename.outputs.apkName }}
